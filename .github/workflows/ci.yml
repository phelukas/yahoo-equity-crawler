name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: equities
          POSTGRES_USER: equities
          POSTGRES_PASSWORD: equities
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equities -d equities"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://equities:equities@localhost:5432/equities
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests with coverage
        run: pytest -m "not e2e" --cov=yahoo_crawler --cov-report=term-missing
      - name: Type check
        run: mypy src

